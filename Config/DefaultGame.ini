; 세션 흐름 레벨 경로. 스테이지 맵의 정본은 DT_Stages(아래 StageDataTable) 행이며,
; DefaultStageMapPath 는 DT 조회 실패 시의 폴백일 뿐이다 — 두 값을 항상 일치시킬 것.
; TutorialMapPath = L_FurnitureProto: 새 게임 최초 진입 시 뜨는 튜토리얼 맵.
; 두 경로가 서로 다른 맵을 가리켜야 ATCPlayerController 가 Tutorial/InGame 화면을 정확히 가른다
; (겹치면 스테이지 1 진입을 튜토리얼로 오판한다).
; v3: 본 레벨 체계 전환 — 로비=L_Lobby, 스테이지1=L_Level1 (2026-07-09).
;     DT_Stages 를 /Game/Data/Stages/ 로 이동 (Developers 폴더는 쿠킹 제외라 참조 불가).
