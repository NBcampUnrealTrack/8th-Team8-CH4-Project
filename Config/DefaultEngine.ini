[OnlineSubsystem]
DefaultPlatformService=Steam

[OnlineSubsystemSteam]
bEnabled=true
; 480 = Spacewar(Steam 공개 테스트 AppID). 실제 출시 시 발급받은 AppID로 교체.
SteamDevAppId=480
; 클라이언트에서도 Steam 소켓 서버 기능 초기화(P2P 리슨 서버용)
bInitServerOnClient=true
; NAT 뒤 PC 끼리도 Steam 릴레이 서버를 경유해 P2P 패킷이 전달되도록 허용.
; (없으면 직결 UDP 만 시도 → 공유기 NAT 에 막혀 '패킷 수신 0' 타임아웃)
bAllowP2PPacketRelay=true
; P2P 연결 대기 한도(초). 릴레이 경유 협상 시간 확보.
P2PConnectionTimeout=90

